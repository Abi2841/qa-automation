name: CI

# On every push / pull request: compile everything and run the framework self-test
# (needs no secrets). The full QA run happens in Jenkins.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn -B clean test-compile
      - name: Framework self-test
        run: mvn -B test -DsuiteXmlFile=src/test/resources/testng-smoke.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            target/surefire-reports/
