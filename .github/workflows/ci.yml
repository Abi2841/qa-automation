name: QA Automation Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 2 * * *' # Nightly at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - STAGING
          - DEV
      browser:
        description: 'Target Browser for UI tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - edge
          - firefox
      headless:
        description: 'Run browser in headless mode'
        required: true
        default: true
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Stage 2 - Install
        run: mvn clean compile test-compile -DskipTests=true

      - name: Stage 3 - API tests
        env:
          API_AUTH_TOKEN: ${{ secrets.QA_API_TOKEN || 'qa-mock-bearer-token-uplift-2026' }}
        run: |
          mvn test -DsuiteXmlFile=src/test/resources/testng-api.xml -Dapi.auth.token="$API_AUTH_TOKEN"

      - name: Stage 4 - UI tests
        env:
          ADMIN_USERNAME: ${{ secrets.QA_ADMIN_USERNAME || 'admin@uplift.com' }}
          ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD || 'AdminPassword123!' }}
        run: |
          mvn test -DsuiteXmlFile=src/test/resources/testng-smoke.xml -Dbrowser=${{ inputs.browser || 'chrome' }} -Dheadless=${{ inputs.headless || true }} -Dadmin.username="$ADMIN_USERNAME" -Dadmin.password="$ADMIN_PASSWORD"

      - name: Stage 5 - Publish report & Archive Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-and-Surefire-Reports
          path: |
            reports/
            target/surefire-reports/
