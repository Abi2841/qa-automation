name: QA Automation Pipeline

# Push / PR: compile and run the framework self-test (demo env, needs no secrets).
# Manual run: the full QA suite; requires repository secrets with the QA URLs and credentials.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser for UI tests'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, edge, firefox ]

jobs:
  framework-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn -B clean test-compile
      - name: Framework self-test (demo environment)
        run: mvn -B test -Denv=demo -DsuiteXmlFile=src/test/resources/testng-smoke.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            reports/
            target/surefire-reports/

  qa-full-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ADMIN_PORTAL_URL: ${{ secrets.QA_ADMIN_PORTAL_URL }}
      EMPLOYER_PORTAL_URL: ${{ secrets.QA_EMPLOYER_PORTAL_URL }}
      API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
      ADMIN_USERNAME: ${{ secrets.QA_ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      API_AUTH_USERNAME: ${{ secrets.QA_API_USERNAME }}
      API_AUTH_PASSWORD: ${{ secrets.QA_API_PASSWORD }}
      INBOX_USERNAME: ${{ secrets.QA_INBOX_USERNAME }}
      INBOX_PASSWORD: ${{ secrets.QA_INBOX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Full suite against QA
        run: mvn -B clean test -Denv=qa -Dbrowser=${{ inputs.browser }} -Dheadless=true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            target/surefire-reports/
