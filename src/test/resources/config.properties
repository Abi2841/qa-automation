# ==============================================================================
# Common configuration shared by every environment.
# Environment-specific values live in environments/<env>.properties (select with -Denv=qa|demo).
# Secrets (passwords, inbox credentials) are NEVER stored here - see secrets.properties.example.
#
# Resolution order for every key (first non-empty wins):
#   1. -Dkey=value                      (Maven / Jenkins command line)
#   2. Environment variable KEY_NAME    (dots become underscores, upper case: admin.password -> ADMIN_PASSWORD)
#   3. src/test/resources/secrets.properties (gitignored, local only)
#   4. environments/<env>.properties
#   5. this file
# ==============================================================================

# Browser Selection: chrome | edge | firefox
browser=chrome
headless=true

# Timeouts (seconds). Implicit wait stays 0: the framework uses explicit waits only.
implicit.wait=0
explicit.wait=20
short.wait=5
page.load.timeout=60

# Reporting
screenshot.on.failure=true
report.path=reports/ExtentReport.html
report.title=QA Automation Execution Report
report.name=Employer Onboarding Journey

# Test data
test.data.prefix=QA-AUTO-
# Date format used when typing dates into non-HTML5 date fields (Irish format)
ui.date.format=dd/MM/yyyy
# Date format written into the bulk-upload CSV (adjust to match the portal template if it differs)
csv.date.format=dd/MM/yyyy
# Query typed into the employer address lookup; the first suggestion is selected
employer.address.lookup=Dublin
employer.payroll.day=25
employer.bank.code=AIBK
employer.bic=AIBKIE2D
# Preferred values for employer admin dropdowns; if absent from the list, the first real option is chosen and logged
employer.admin.economic.status=Employed
employer.admin.occupation=Manager
employer.admin.pep.answer=No

# Test inbox (IMAP). Gmail: enable 2FA and create an App Password; "+alias" addresses are used per run.
inbox.imap.host=imap.gmail.com
inbox.imap.port=993
inbox.timeout.seconds=180
inbox.poll.seconds=5
# Regex with one capture group used to read the verification code from the invite email
inbox.code.regex=(?i)code\\D{0,40}?(\\d{4,8})
# Verify the employee introduction email arrives (Part F bonus); needs inbox credentials
verify.employee.invite.email=true
