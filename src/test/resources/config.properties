# ==============================================================================
# QA Automation Framework Environment Configuration
# ==============================================================================

# Web UI Application Under Test
base.url=https://the-internet.herokuapp.com
admin.portal.url=https://the-internet.herokuapp.com/login
employer.portal.url=https://the-internet.herokuapp.com/login

# REST API Base URL
api.base.url=https://reqres.in/api
api.auth.endpoint=/login
api.employees.endpoint=/users

# Browser Selection: chrome | edge | firefox
browser=chrome

# Headless Execution: true | false
headless=true

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Test Execution & Reporting
screenshot.on.failure=true
report.path=reports/ExtentReport.html
report.title=QA Automation Execution Report
report.name=Smoke Test Results
