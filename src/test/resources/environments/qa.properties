# ==============================================================================
# Provider QA environment (the ONLY environment the journey/API suites may run against).
# The QA URLs were "sent separately" with the assignment and are not stored in this repo.
# Supply them here locally, or (preferred for CI) as -D flags / environment variables:
#   ADMIN_PORTAL_URL, EMPLOYER_PORTAL_URL, API_BASE_URL
# Any suite that needs a missing value fails fast with a message naming the key.
# ==============================================================================
admin.portal.url=
employer.portal.url=
api.base.url=

# --- API contract: copy the paths from the provided Swagger. Field names below are
# common defaults; change them if the Swagger uses different names. ---
api.auth.endpoint=
api.auth.username.field=email
api.auth.password.field=password
api.auth.token.path=token
api.employees.endpoint=
api.employee.id.path=id
# Optional: employer the API-created employee belongs to, if the Swagger requires it
api.employer.id=

# Optional: expected employer status text in the employer list (e.g. Active / Pending)
employer.expected.status=
